<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capture View</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #ffffff;
            /* Container exactly sized to fit the card well for the screencast */
            width: 600px;
            height: 480px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body.dark {
            background: #111111;
        }

        ha-card {
            background: white;
            border-radius: 4px;
            box-shadow: 0 2px 2px rgba(0, 0, 0, 0.1);
            display: block;
            width: 100%;
            height: 100%;
            color: #333;
        }

        body.dark ha-card {
            background: #1c1c1c;
            color: #e1e1e1;
            box-shadow: 0 2px 2px rgba(0, 0, 0, 0.5);
            /* Simulate HA CSS variables */
            --ha-card-background: #1c1c1c;
            --card-background-color: #1c1c1c;
            --primary-text-color: #e1e1e1;
            --secondary-text-color: #b0b0b0;
            --divider-color: #444;
            --primary-background-color: #2c2c2c;
            --secondary-background-color: #333;
        }
    </style>
    <script type="module" src="/src/airflow-card.ts"></script>
</head>
<body>
    <airflow-card id="demo-card"></airflow-card>

    <script>
        const card = document.getElementById('demo-card');
        const params = new URLSearchParams(window.location.search);
        const mode = params.get('mode') || 'normal';

        let bypassState = 'off';
        let cardMode = 'light';
        
        if (mode === 'bypass') {
            bypassState = 'on';
        } else if (mode === 'dark') {
            document.body.classList.add('dark');
            cardMode = 'dark';
        }

        const hass = {
            language: 'en',
            states: {
                'sensor.temp_supply': { state: '21.5', attributes: { unit_of_measurement: '°C' } },
                'sensor.temp_extract': { state: '22.0', attributes: { unit_of_measurement: '°C' } },
                'sensor.temp_outdoor': { state: '5.0', attributes: { unit_of_measurement: '°C' } },
                'sensor.temp_exhaust': { state: '8.0', attributes: { unit_of_measurement: '°C' } },
                'sensor.fan_supply': { state: 'auto', attributes: {} },
                'sensor.fan_extract': { state: 'auto', attributes: {} },
                'sensor.efficiency': { state: '85', attributes: { unit_of_measurement: '%' } },
                'sensor.fan_level': { state: '2', attributes: {} },
                'binary_sensor.bypass': { state: bypassState, attributes: {} },
            }
        };

        const config = {
            type: 'custom:airflow-card',
            name: 'Ventilation Demo',
            entity_temp_supply: 'sensor.temp_supply',
            entity_temp_extract: 'sensor.temp_extract',
            entity_temp_outdoor: 'sensor.temp_outdoor',
            entity_temp_exhaust: 'sensor.temp_exhaust',
            entity_fan_supply: 'sensor.fan_supply',
            entity_fan_extract: 'sensor.fan_extract',
            entity_level: 'sensor.fan_level',
            level_min: 0,
            level_max: 4,
            entity_efficiency: 'sensor.efficiency',
            efficiency_calculation_dynamic: true,
            entity_bypass: 'binary_sensor.bypass',
            color_outdoor: '#2196F3',
            color_supply: '#4CAF50',
            color_extract: '#FFB300',
            color_exhaust: '#F44336',
            card_background_mode: cardMode
        };

        customElements.whenDefined('airflow-card').then(() => {
            card.setConfig(config);
            card.hass = hass;
        });
    </script>
</body>
</html>
