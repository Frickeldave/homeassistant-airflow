<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airflow Card Demo</title>
    <style>
        body {
            font-family: sans-serif;
            background: #fafafa;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }

        body.dark {
            background: #111;
            color: #eee;
        }

        ha-card {
            background: white;
            border-radius: 4px;
            box-shadow: 0 2px 2px rgba(0, 0, 0, 0.1);
            display: block;
            max-width: 600px;
            margin: 0 auto;
            color: #333;
        }

        body.dark airflow-card {
            background: #1c1c1c;
            color: #e1e1e1;
            box-shadow: 0 2px 2px rgba(0, 0, 0, 0.5);
            /* Simulate HA CSS variables */
            --ha-card-background: #1c1c1c;
            --card-background-color: #1c1c1c;
            --primary-text-color: #e1e1e1;
            --secondary-text-color: #b0b0b0;
            --divider-color: #444;
            --primary-background-color: #2c2c2c;
            --secondary-background-color: #333;
        }
    </style>
    <script type="module" src="/src/airflow-card.ts"></script>
</head>

<body>
    <h1>Airflow Card Demo</h1>

    <div style="margin-bottom: 20px; text-align: center;">
        <button onclick="setLanguage('en')">English</button>
        <button onclick="setLanguage('de')">Deutsch</button>
        <button onclick="toggleDarkMode()">Toggle Dark Mode</button>
        <button onclick="toggleBypass()">Toggle Bypass</button>
    </div>

    <div style="margin-bottom: 20px; text-align: center;">
        <button onclick="setLanguage('en')">English</button>
        <button onclick="setLanguage('de')">Deutsch</button>
        <button onclick="toggleDarkMode()">Toggle Dark Mode</button>
        <button onclick="toggleBypass()">Toggle Bypass</button>
        <button onclick="toggleColorMode()">Toggle Color Mode (Dynamic)</button>
    </div>

    <div style="margin-bottom: 20px; text-align: center;">
        <label>Outdoor Temp: <input type="number" id="tempOutdoor" value="18.0" step="1" onchange="updateTemps()"></label>
        <label>Supply Temp: <input type="number" id="tempSupply" value="21.5" step="1" onchange="updateTemps()"></label>
        <label>Extract Temp: <input type="number" id="tempExtract" value="22.0" step="1" onchange="updateTemps()"></label>
        <label>Exhaust Temp: <input type="number" id="tempExhaust" value="8.0" step="1" onchange="updateTemps()"></label>
    </div>

    <airflow-card id="demo-card"></airflow-card>

    <script>
        let currentLang = 'en';
        let bypassActive = false;
        let colorMode = 'static';
        let temps = {
            outdoor: '18.0',
            supply: '21.5',
            extract: '22.0',
            exhaust: '8.0'
        };
        const cardId = 'demo-card';

        function updateCard() {
            const card = document.getElementById(cardId);
            const hass = {
                states: {
                    'sensor.temp_supply': { state: temps.supply, attributes: { unit_of_measurement: '°C' } },
                    'sensor.temp_extract': { state: temps.extract, attributes: { unit_of_measurement: '°C' } },
                    'sensor.temp_outdoor': { state: temps.outdoor, attributes: { unit_of_measurement: '°C' } },
                    'sensor.temp_exhaust': { state: temps.exhaust, attributes: { unit_of_measurement: '°C' } },
                    'sensor.fan_supply': { state: '0', attributes: {} },
                    'sensor.fan_extract': { state: '0', attributes: {} },
                    'sensor.efficiency': { state: '85', attributes: { unit_of_measurement: '%' } },
                    'sensor.fan_level': { state: '2', attributes: {} },
                    'binary_sensor.bypass': { state: bypassActive ? 'on' : 'off', attributes: {} },
                }
            };

            const config = {
                type: 'custom:airflow-card',
                name: 'Ventilation Demo',
                language: currentLang,
                entity_temp_supply: 'sensor.temp_supply',
                entity_temp_extract: 'sensor.temp_extract',
                entity_temp_outdoor: 'sensor.temp_outdoor',
                entity_temp_exhaust: 'sensor.temp_exhaust',
                entity_fan_supply: 'sensor.fan_supply',
                entity_fan_extract: 'sensor.fan_extract',
                entity_level: 'sensor.fan_level',
                level_min: 0,
                level_max: 4,
                entity_efficiency: 'sensor.efficiency',
                efficiency_calculation_dynamic: true,
                entity_bypass: 'binary_sensor.bypass',
                color_mode: colorMode,
                color_outdoor: '#2196F3',
                color_supply: '#4CAF50',
                color_extract: '#FFB300',
                color_exhaust: '#F44336',
                base_color_supply: '#4CAF50',
                base_color_exhaust: '#FFB300'
            };

            card.setConfig(config);
            card.hass = hass;
        }

        function setLanguage(lang) {
            currentLang = lang;
            updateCard();
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark');
        }

        function toggleBypass() {
            bypassActive = !bypassActive;
            updateCard();
        }

        function toggleColorMode() {
            colorMode = colorMode === 'static' ? 'dynamic_temp' : 'static';
            updateCard();
        }

        function updateTemps() {
            temps.outdoor = document.getElementById('tempOutdoor').value;
            temps.supply = document.getElementById('tempSupply').value;
            temps.extract = document.getElementById('tempExtract').value;
            temps.exhaust = document.getElementById('tempExhaust').value;
            updateCard();
        }

        customElements.whenDefined('airflow-card').then(() => {
            updateCard();
        });
    </script>
</body>

</html>
